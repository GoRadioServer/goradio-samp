name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # samp03svr is 32-bit; open.mp is 64-bit. Each ships with and
          # without TLS -- see the release notes for which to pick.
          - bits: 32
            tls: 0
            platform: linux-x86
          - bits: 32
            tls: 1
            platform: linux-x86-tls
          - bits: 64
            tls: 0
            platform: linux-x86_64
          - bits: 64
            tls: 1
            platform: linux-x86_64-tls
    steps:
      - uses: actions/checkout@v4

      # Built in the repo's own toolchain container rather than on the
      # runner: it carries the 32-bit toolchain and, more importantly,
      # libssl-dev:i386, which Ubuntu's runner image does not reliably
      # have. The image also asserts the architecture, the six-symbol
      # export list, and that a TLS build has no libssl runtime
      # dependency.
      - name: Build
        run: |
          make docker \
            BITS=${{ matrix.bits }} \
            TLS=${{ matrix.tls }} \
            VERSION=${{ needs.version.outputs.value }}

      - name: Test
        run: docker build --target test --build-arg BITS=${{ matrix.bits }} .

      - name: Package
        run: |
          scripts/package.sh "${{ needs.version.outputs.value }}" \
            "${{ matrix.platform }}" bin/goradio.so

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: Win32
            triplet: x86-windows-static-md
            tls: "OFF"
            platform: windows-x86
          - arch: Win32
            triplet: x86-windows-static-md
            tls: "ON"
            platform: windows-x86-tls
          - arch: x64
            triplet: x64-windows-static-md
            tls: "OFF"
            platform: windows-x86_64
          - arch: x64
            triplet: x64-windows-static-md
            tls: "ON"
            platform: windows-x86_64-tls
    steps:
      - uses: actions/checkout@v4

      # static-md: OpenSSL linked statically, against the dynamic CRT the
      # server itself uses. A plugin that needs libssl beside the .dll
      # would be no better than not shipping TLS at all.
      - name: Install OpenSSL
        if: matrix.tls == 'ON'
        run: vcpkg install openssl:${{ matrix.triplet }}

      - name: Configure (no TLS)
        if: matrix.tls == 'OFF'
        run: >
          cmake -B build -A ${{ matrix.arch }}
          -DGORADIO_32BIT=OFF
          -DGORADIO_VERSION=${{ needs.version.outputs.value }}

      - name: Configure (TLS)
        if: matrix.tls == 'ON'
        run: >
          cmake -B build -A ${{ matrix.arch }}
          -DGORADIO_32BIT=OFF
          -DGORADIO_TLS=ON
          -DGORADIO_VERSION=${{ needs.version.outputs.value }}
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build build --config Release

      # A DLL exporting decorated names loads as a bare "Failed." with no
      # explanation, so it is checked before it can reach a release.
      - name: Check the DLL exports
        shell: pwsh
        run: pwsh scripts/check-dll-exports.ps1 build/Release/goradio.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-dll
          path: build/Release/goradio.dll
          if-no-files-found: error

  package-windows:
    # Packaged on Linux so there is one packaging script rather than a
    # PowerShell copy of it that drifts.
    needs: [version, windows]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows-x86, windows-x86-tls, windows-x86_64, windows-x86_64-tls]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}-dll
          path: winbin

      - name: Package
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          scripts/package.sh "${{ needs.version.outputs.value }}" \
            "${{ matrix.platform }}" winbin/goradio.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, linux, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-x86*"
          merge-multiple: true

      - name: List what is being released
        run: ls -la artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.value }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Which download

            Pick your platform, then decide whether you need TLS.

            | File | For |
            |---|---|
            | `goradio-${{ needs.version.outputs.value }}-linux-x86.tar.gz` | Linux `samp03svr` (32-bit) |
            | `goradio-${{ needs.version.outputs.value }}-windows-x86.zip` | Windows `samp-server.exe` (32-bit) |
            | `goradio-${{ needs.version.outputs.value }}-linux-x86_64.tar.gz` | Linux open.mp (64-bit) |
            | `goradio-${{ needs.version.outputs.value }}-windows-x86_64.zip` | Windows open.mp (64-bit) |

            SA-MP is a 32-bit process and will not load an x86_64 build.
            If the server log says `Failed.` next to the plugin, that is
            almost always why.

            ### `-tls` builds

            The same four, with OpenSSL linked in statically:

            | File | For |
            |---|---|
            | `goradio-${{ needs.version.outputs.value }}-linux-x86-tls.tar.gz` | Linux `samp03svr` (32-bit) |
            | `goradio-${{ needs.version.outputs.value }}-windows-x86-tls.zip` | Windows `samp-server.exe` (32-bit) |
            | `goradio-${{ needs.version.outputs.value }}-linux-x86_64-tls.tar.gz` | Linux open.mp (64-bit) |
            | `goradio-${{ needs.version.outputs.value }}-windows-x86_64-tls.zip` | Windows open.mp (64-bit) |

            Take one of these if `goradio_url` needs to be an **`https://`**
            address — an audio server behind a TLS-terminating proxy, or
            reached across the public internet. Nothing needs installing
            on the server; OpenSSL is inside the binary.

            The plain builds speak HTTP only and **refuse** an `https://`
            URL at startup rather than quietly sending your token in the
            clear. If your audio server is on the same host or a private
            network, they are the smaller, simpler choice.

            Both variants are otherwise identical, and the file inside is
            `goradio.so` / `goradio.dll` either way — swapping variants is
            a file copy, with no `server.cfg` change.

            ### Installing

            Each archive mirrors a SA-MP server directory — copy the
            folders over your server root. `INSTALL.txt` inside has the
            `server.cfg` settings.

            Documentation: https://tmfksoft.github.io/goradio-samp/
