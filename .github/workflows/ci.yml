name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  linux:
    name: Linux (${{ matrix.bits }}-bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v4

      - name: Install the 32-bit toolchain
        if: matrix.bits == 32
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Build
        run: make BITS=${{ matrix.bits }}

      # The suite runs against test/fake_audioserver.py, so it exercises
      # the real HTTP client and Connect framing without needing an audio
      # server. Running it at both widths matters: 32-bit is what ships.
      - name: Test
        run: sh test/run_tests.sh
        env:
          BITS: ${{ matrix.bits }}

      - name: Check the exported symbols
        run: |
          exports=$(nm -D --defined-only bin/goradio.so | awk '{print $3}' | sort | tr '\n' ' ')
          echo "exports: $exports"
          # -static-libstdc++ leaves thousands of runtime symbols visible
          # without the version script, and SA-MP loads several plugins
          # into one process -- so this staying at six is load-bearing.
          test "$exports" = "AmxLoad AmxUnload Load ProcessTick Supports Unload "

  linux-tls:
    name: Linux TLS (${{ matrix.bits }}-bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v4

      # In the container, which has libssl-dev for both architectures --
      # Ubuntu's runner image does not reliably carry the i386 one. The
      # image asserts the architecture, that exactly six symbols are
      # exported (static OpenSSL would otherwise publish thousands), and
      # that the result has no libssl runtime dependency.
      - name: Build with TLS
        run: make docker BITS=${{ matrix.bits }} TLS=1

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, "address,undefined"]
    steps:
      - uses: actions/checkout@v4

      - name: Build the suite with -fsanitize=${{ matrix.sanitizer }}
        run: |
          g++ -std=c++11 -g -fsanitize=${{ matrix.sanitizer }} -Isdk -Isrc \
            test/run_tests.cpp src/json.cpp src/http.cpp src/log.cpp \
            src/connect_client.cpp src/station.cpp src/manager.cpp \
            -o /tmp/run_tests -lpthread

      - name: Run against the fake audio server
        run: |
          python3 test/fake_audioserver.py > /tmp/url.txt 2> /tmp/server.log &
          for i in $(seq 50); do [ -s /tmp/url.txt ] && break; sleep 0.1; done
          /tmp/run_tests "$(cat /tmp/url.txt)"

  export-check:
    name: DLL export checker self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests scripts/check-dll-exports.ps1 against captured dumpbin
      # output. pwsh is preinstalled on the runner, so this needs no
      # Windows and fails before the Windows jobs even start -- which is
      # the point: the checker itself shipped broken once.
      - name: Test the export checker
        run: pwsh -File test/test-dll-exports.ps1

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
          - arch: x64
    steps:
      - uses: actions/checkout@v4

      # PowerShell argument-mode parsing bites -D arguments three ways:
      # an unquoted value splits at a dot (v1.0.0 becomes two arguments),
      # $var is not expanded, and neither is $env:VAR. Quote every one.
      - name: Configure
        shell: pwsh
        run: cmake -B build -A ${{ matrix.arch }} "-DGORADIO_32BIT=OFF"

      - name: Build
        run: cmake --build build --config Release

      - name: Check the DLL exports
        shell: pwsh
        run: pwsh scripts/check-dll-exports.ps1 build/Release/goradio.dll

  windows-tls:
    name: Windows TLS (${{ matrix.arch }})
    # Only on pushes: vcpkg builds OpenSSL from source, which is slow
    # enough that putting it on every PR would not pay for itself. This
    # still runs before any tag, which is the point.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            triplet: x86-windows-static-md
          - arch: x64
            triplet: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: vcpkg install openssl:${{ matrix.triplet }}

      - name: Configure
        shell: pwsh
        run: |
          # $env:VAR is NOT expanded when it appears mid-argument, after
          # something like -DFOO=. PowerShell passes the literal string
          # through and CMake reports a toolchain file it cannot find.
          # Build the path first, then pass it as a quoted argument.
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
            throw "vcpkg toolchain not found at $toolchain"
          }
          cmake -B build -A ${{ matrix.arch }} `
            "-DGORADIO_32BIT=OFF" `
            "-DGORADIO_TLS=ON" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Check it produced a DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "build/Release/goradio.dll")) { throw "goradio.dll was not produced" }
          Write-Host "TLS build produced $((Get-Item build/Release/goradio.dll).Length) bytes"

  pawn:
    name: PAWN API surface
    runs-on: ubuntu-latest
    env:
      PAWNC_VERSION: 3.10.10
    steps:
      - uses: actions/checkout@v4

      # Catches a native declared but not registered, and any name over
      # PAWN's 31-character symbol limit -- both of which compile cleanly
      # and then fail at runtime.
      - name: Check names
        run: make check-names

      - name: Fetch the Pawn compiler
        run: |
          mkdir -p /tmp/pawn && cd /tmp/pawn
          curl -fsSL -o pawnc.tar.gz \
            "https://github.com/pawn-lang/compiler/releases/download/v${PAWNC_VERSION}/pawnc-${PAWNC_VERSION}-linux.tar.gz"
          tar xzf pawnc.tar.gz

      # Two separate repositories: pawn-stdlib has core.inc/float.inc, and
      # samp-stdlib has a_samp.inc. The compiler tarball ships neither.
      - name: Fetch the standard libraries
        run: |
          git clone -q --depth 1 https://github.com/pawn-lang/pawn-stdlib /tmp/pawn/pawn-stdlib
          git clone -q --depth 1 https://github.com/pawn-lang/samp-stdlib /tmp/pawn/samp-stdlib

      - name: Compile the example filterscript
        run: |
          export LD_LIBRARY_PATH="/tmp/pawn/pawnc-${PAWNC_VERSION}-linux/lib"
          # -Z+ is compatibility mode, which is what Pawno uses; the SA-MP
          # standard library does not compile cleanly without it.
          "/tmp/pawn/pawnc-${PAWNC_VERSION}-linux/bin/pawncc" \
            examples/goradio_example.pwn \
            -i/tmp/pawn/pawn-stdlib -i/tmp/pawn/samp-stdlib -iinclude \
            -o/tmp/goradio_example.amx -Z+ -d3 2>&1 | tee /tmp/pawncc.log
          test -f /tmp/goradio_example.amx

          # warning 200 is symbol truncation: the compiler quietly shortens
          # the name, the plugin registers the full one, and the native
          # never binds. make check-names should have caught it first --
          # this is the backstop.
          if grep -q "warning 200" /tmp/pawncc.log; then
            echo "::error::pawncc truncated a symbol -- see warning 200 above"
            exit 1
          fi

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      # --strict turns broken internal links and missing nav files into
      # build failures, which is the only way they get noticed.
      - run: mkdocs build --strict
        working-directory: docs
